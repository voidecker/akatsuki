<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akatsuki on Blackrock</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: clamp(1rem, 5vw, 3rem);
        background-color: #121212;
        color: #fff;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }

      main {
        max-width: 48rem;
        margin-inline: auto;
      }

      h1, h2 {
        line-height: 1.25;
      }

      h1 {
        font-size: clamp(1.75rem, 5vw, 2.5rem);
      }

      h2 {
        font-size: clamp(1.25rem, 4vw, 1.75rem);
      }

      a {
        color: #9dc5ff;
        overflow-wrap: anywhere;
      }

      main > div {
        margin-block: 1.5rem;
      }

      .video {
        width: 100%;
        aspect-ratio: 16 / 9;
      }

      .video iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>👋 Were you in the guild Akatsuki, on the server Blackrock between ~2005 - ~2008?</h1>

      <h2>Has the <a href="https://www.youtube.com/watch?v=xXaXYxcbA6A">WoW Forever announcement</a> made you nostalgic?</h2>

      <div>
        Do the toon names:
        <ul>
          <li>Aniko</li>
          <li>Miko</li>
          <li>Methedras</li>
          <li>Cyobi</li>
        </ul>
        Mean anything to you?
      </div>

      <div>
        Reach out at:
        <a href="mailto:akatsuki-blackrock@proton.me">akatsuki-blackrock AT proton.me</a>
      </div>

      <hr>

      <h1>Wall of Memories</h1>
      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/GncKMde0Edk"
          title="Akatsuki Wall of Memories video"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
